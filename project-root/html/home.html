<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Restaurants</title>
  <link rel="stylesheet" href="../css/home_style.css">
  <link rel="stylesheet" href="../css/auth_style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Your module -->
  <script type="module" src="../components/map.js"></script>
</head>
<body>

  <div id="nav-root"></div>

  <header class="header">
    <h1>Student Restaurants</h1>
    <p>Find daily and weekly menus across Finland</p>
  </header>

  <main class="container">

    <!-- Filters -->
    <section class="filters">
      <input id="restaurant-search" type="text" placeholder="Search restaurant...">
      <select id="city-filter">
        <option value="">All Cities</option>
      </select>
      
      <select id="company-filter">
        <option value="">All Providers</option>
      </select>
    </section>

    <!-- Content Layout -->
    <section class="content">

      <!-- Restaurant List -->
      <div class="restaurant-list">
        <h2 class = "section-title">Restaurants</h2>

        <div class="restaurant-card highlight">
          <h3>Restaurant Name</h3>
          <p>Address, City</p>
        </div>

        <div class="restaurant-card">
          <h3>Another Restaurant</h3>
          <p>Address, City</p>
        </div>

      </div>

      <!-- Map -->
      <div class="map">
        <h2>Map</h2>
          <div id="map" style="height: 400px;">
            <div id="map-popup" class="map-popup hidden"></div>
          </div>
          
      </div>
      

    </section>

  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      
      <div class="modal-header">
        <button class="close-btn" id="modal-close">×</button>
      </div>

      <div id="restaurant-profile"></div>
  
      <!-- Tabs -->
      <div class="menu-tabs">
        <button id="tab-daily" class="tab active">Today</button>
        <button id="tab-weekly" class="tab">This Week</button>
      </div>
  
      <!-- Content -->
      <div id="menu-content">
        <p>Loading...</p>
      </div>
  
    </div>
  </div>
  

</body>
</html>
