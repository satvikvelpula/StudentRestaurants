<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="../css/home_style.css">
  <link rel="stylesheet" href="../css/auth_style.css">
  <script type="module" src="../components/dashboard.js"></script>
</head>

<body>

  <div id="nav-root"></div>

    <div class="auth-container">
        <div class="auth-card dashboard-card">
          <h2 class="auth-title">Your Dashboard</h2>
      
          <!-- Profile Summary -->
          <div class="profile-summary">
            <img src="https://via.placeholder.com/80" alt="Profile Picture" class="profile-pic">
            <div class="profile-info">
              <h3 id="user-name">Loading...</h3>
              <p id="user-email">Loading...</p>
              <p>Your Location: <strong id="user-location">Detecting...</strong></p>
              <p>Favorite Restaurant: <strong id = "user-favorite">Loading...</strong></p>
            </div>
          </div>

          <div class="dashboard-actions">
            <button class="action-btn" id="edit-profile-btn">Edit Profile</button>
            <button class="action-btn logout-btn" id="logout-btn">Logout</button>
            <button class="action-btn delete-btn" id="delete-account-btn">Delete Account</button>
          </div>

          <div id="delete-confirmation" class="delete-confirmation">
            <p class="delete-warning">
              Type <strong>DELETE</strong> to confirm.
            </p>

            <input id="delete-confirm-input" placeholder="DELETE" />
            <p id="delete-error" class="input-error"></p>

            <div class="delete-actions">
              <button id="cancel-delete" class="action-btn">Cancel</button>
              <button id="confirm-delete" disabled class="danger">Delete</button>
            </div>
          </div>
      
          <!-- Favorite Restaurants Grid -->
          <h3 class="section-title">Your Favorite Restaurant</h3>
          <div class="favorite-restaurant">
            <div id="favorite-restaurant-card" class="restaurant-card highlight">
              <h3>Loading... </h3>
              <p>...</p>
            </div>
          </div>
      
          <div class="auth-footer">
            <a href = "home.html">Back to Home</a>
          </div>
        </div>
      </div>
      

</body>
